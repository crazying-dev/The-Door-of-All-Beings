[project]
name = "the-door-of-bings-server"
version = "1.0.0"
description = "众生之门（The Door of All Beings）账号 / 设备绑定服务端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "waitress>=3.0.0",
]

# 本项目是应用而非库：不要让 uv 尝试构建包
[tool.uv]
package = false
