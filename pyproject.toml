[project]
name = "the-door-of-bings-server-socket"
version = "3.0.0"
description = "众生之门（The Door of All Beings）TCP 游戏协议服务：长连接 + 10Hz 推送 + 账号/世界数据"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
]

# 本项目是应用而非库：不要让 uv 尝试构建包。
# 注意：因此不能用 [project.scripts] 提供命令别名（uv 的入口点表要求项目被构建并安装）；
# 一键运行请直接传脚本路径，例如 `uv run main.py`、`uv run scripts/init_db.py`。
[tool.uv]
package = false
